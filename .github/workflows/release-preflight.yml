name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Inspect production authentication configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}`;
          async function read(path) {
            const response = await fetch(base + path, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) {
              console.log(`${path}: HTTP ${response.status}`);
              return null;
            }
            const data = await response.json();
            if (!data.success) throw new Error(`Cloudflare request failed: ${path}`);
            return data.result;
          }
          const settings = await read('/workers/scripts/blog/settings');
          if (!settings) throw new Error('Cannot inspect production Worker settings');
          // Binding names and Access identifiers are public configuration.
          // Never log secret binding values or the Cloudflare API response.
          const accessBindings = (settings.bindings ?? []).filter(binding => ['ACCESS_TEAM_DOMAIN', 'ACCESS_AUD'].includes(binding.name));
          console.log('Worker Access bindings:', JSON.stringify(accessBindings.map(binding => ({ name: binding.name, type: binding.type }))));
          const organization = await read('/access/organizations');
          if (organization) console.log('Access team domain:', organization.auth_domain);
          const apps = await read('/access/apps');
          if (apps) {
            const matches = apps.filter(app => /^(?:www\.)?mrwuliu\.top(?:\/|$)/.test(app.domain ?? ''));
            console.log('Blog Access applications:', JSON.stringify(matches.map(app => ({ name: app.name, domain: app.domain, aud: app.aud }))));
          }
          NODE
