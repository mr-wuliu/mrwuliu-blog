name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install admin dependencies
        run: cd admin && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build public CSS and admin SPA
        run: npm run build:deploy

      - name: Validate Cloudflare auth
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations (production)
        run: npm run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Worker secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if { [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -z "$ACCESS_AUD" ]; } || { [ -z "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ]; }; then
            echo "ACCESS_TEAM_DOMAIN and ACCESS_AUD must be configured together."
            exit 1
          fi
          for name in API_KEY RESEND_API_KEY MAIL_DOMAIN JWT_SECRET ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" --env production
            fi
          done

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
